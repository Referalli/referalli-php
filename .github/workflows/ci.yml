# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer validate
      - run: composer install --no-interaction --no-progress
      - name: Lint (php -l)
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: |
          set -e
          for f in tests/test_*.php; do php "$f" testdata/webhook-vectors.json; done
