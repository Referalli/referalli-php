# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# Packagist picks up vX.Y.Z tags through its GitHub hook (register referalli/referalli-php once on
# packagist.org). This checks the tagged version and creates the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer validate
      - name: Version matches the tag
        run: grep -Rq "VERSION = '${GITHUB_REF_NAME#v}'" src
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
